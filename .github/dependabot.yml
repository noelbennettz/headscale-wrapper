version: 2
updates:
  # Every action in .github/workflows is pinned by commit SHA; Dependabot keeps
  # those pins current and rewrites the trailing `# vX.Y.Z` comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
