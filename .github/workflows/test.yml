name: test

on:
  push:
    branches: [main]
  pull_request:
  # A weekly run so a stale fixture or a new linter release shows up even when
  # nobody pushes.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned tool versions. The checksums are the published release artefacts, so
  # a replaced download fails instead of running unreviewed code.
  SHELLCHECK_VERSION: v0.10.0
  SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
  ACTIONLINT_VERSION: 1.7.7
  ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
  SHFMT_VERSION: 3.12.0
  SHFMT_SHA256: d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea

jobs:
  syntax:
    name: bash syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash -n
        run: bash -n hs install.sh uninstall.sh test/smoke.sh test/docs-paths.sh test/integration.sh

  shellcheck:
    name: shellcheck
    needs: syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned shellcheck
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/shellcheck"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$dir/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$dir/shellcheck.tar.xz" -C "$dir"
          printf '%s\n' "$dir/shellcheck-${SHELLCHECK_VERSION}" >>"$GITHUB_PATH"
      - name: shellcheck --version
        run: shellcheck --version
      - name: shellcheck
        run: shellcheck hs install.sh uninstall.sh test/smoke.sh test/docs-paths.sh test/integration.sh test/fakebin/headscale

  format:
    name: shfmt
    needs: syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned shfmt
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/shfmt"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          printf '%s  %s\n' "$SHFMT_SHA256" "$dir/shfmt" | sha256sum -c -
          chmod +x "$dir/shfmt"
          printf '%s\n' "$dir" >>"$GITHUB_PATH"
      - name: shfmt -d
        # -i 0 keeps tabs, -ci indents case branches: the repo is formatted to
        # that style, so a diff means a file was not formatted.
        run: |
          shfmt --version
          shfmt -d -ci -i 0 hs install.sh uninstall.sh test/smoke.sh test/docs-paths.sh test/integration.sh test/fakebin/headscale

  actionlint:
    name: actionlint
    needs: syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$dir/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$dir/actionlint.tar.gz" -C "$dir"
          printf '%s\n' "$dir" >>"$GITHUB_PATH"
      - name: actionlint
        run: actionlint

  smoke:
    name: smoke tests
    needs: syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install optional tools used by the IPv4/IPv6 cases
        # strace and bubblewrap only add three checks; the suite skips them when
        # they are missing, so a slow apt mirror must not hold the job hostage.
        run: |
          sudo timeout 180 apt-get update || true
          sudo timeout 180 apt-get install -y --no-install-recommends strace bubblewrap || true
      - name: ./test/smoke.sh
        run: ./test/smoke.sh

  docs:
    name: documentation paths
    needs: syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ./test/docs-paths.sh
        run: ./test/docs-paths.sh

  integration:
    # A real headscale in Docker: hs talks to it through `docker exec`, and a
    # Tailscale client in userspace mode registers a node so that ls/show/route
    # have something real to read. Image digests, because the point is to test
    # against a fixed server build; the tag is in the job name.
    # headscale has no v0.30 yet: the matrix covers the first and the latest
    # patch of the supported v0.29 minor and gains a row when a new minor ships.
    name: integration headscale ${{ matrix.headscale }}
    needs: syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - headscale: v0.29.0
            image: ghcr.io/juanfont/headscale@sha256:5d464c7ba8f5b2c1472f926fae4cd67f136d66ec108c0b4ad1891856ac6da915
          - headscale: v0.29.7
            image: ghcr.io/juanfont/headscale@sha256:11f81665e842809db9fe3006a38c56a66e968baa5abd4bac498e86445572b970
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker version
        run: docker version
      - name: ./test/integration.sh
        env:
          HS_IT_IMAGE: ${{ matrix.image }}
        run: ./test/integration.sh
